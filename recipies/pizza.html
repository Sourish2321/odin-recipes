       <h1>pizza</h1>

    <h2>Step 1</h2>
    <p> Preheat the oven to 450 degrees F (230 degrees C). </p>
    <br>
    <h2>Step 2</h2>
    <p>Spread pesto on pizza crust. Top with tomato, bell pepper, olives, red onion, artichoke hearts, and feta cheese. </p>
    <br>
    <h2>Step 3</h2>
    <p>Bake in the preheated oven until cheese is melted and browned, 8 to 10 minutes. </p>
